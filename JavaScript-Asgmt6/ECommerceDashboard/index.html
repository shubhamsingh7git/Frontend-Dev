<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Store – Product Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    h2 { text-align: center; }
    #products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .card img {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }
    .error {
      color: red;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>🛒 Fake Store – Product Dashboard</h2>

  <button id="load">Load Products</button>
  <p id="status"></p>
  <div id="products"></div>

  <script src="script.js"></script>
</body>
</html>
