<!DOCTYPE html>
<html>
<head>
  <title>Dynamic Object Updater</title>
  <style>
    input {
      padding: 8px;
      margin-bottom: 10px;
      width: 250px;
      border: 2px solid #ccc;
      display: block;
    }
    #output {
      margin-top: 20px;
      padding: 10px;
      border: 2px solid black;
      width: 280px;
    }
  </style>
</head>
<body>

  <h2>Update User Object</h2>

  <label>Name:</label>
  <input type="text" id="name">

  <label>Email:</label>
  <input type="text" id="email">

  <label>Age:</label>
  <input type="number" id="age">

  <button id="updateBtn">Update</button>

  <div id="output"></div>

  <script src="script.js"></script>
</body>
</html>
