<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Registration</title>
  <link rel="stylesheet" href="Q3.css">
</head>
<body>
  <h2>Course Registration</h2>
  <form>
    <fieldset>
      <legend>Student Info</legend>
      <label>Name:</label>
      <input type="text"><br><br>
      <label>Email:</label>
      <input type="email"><br><br>
    </fieldset>

    <fieldset>
      <legend>Select Course</legend>
      <select>
        <option>Web Development</option>
        <option>AI Fundamentals</option>
      </select>
    </fieldset>

    <h3>Available Schedules</h3>
    <table border="1">
      <tr><th>Day</th><th>Time</th><th>Instructor</th></tr>
      <tr><td>Mon</td><td>10am</td><td>John</td></tr>
      <tr><td>Wed</td><td>2pm</td><td>Anna</td></tr>
    </table>
  </form>
</body>
</html>
