<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Table</title>
  <link rel="stylesheet" href="Q5.css">
</head>
<body>
  <section class="pricing-container">
    <div class="plan">
      <h2>Basic</h2>
      <p class="price">$9/mo</p>
      <ul>
        <li>1 User</li>
        <li>5GB Storage</li>
        <li>Email Support</li>
      </ul>
      <a href="#">Choose Plan</a>
    </div>

    <div class="plan popular">
      <h2>Standard</h2>
      <p class="price">$19/mo</p>
      <ul>
        <li>5 Users</li>
        <li>50GB Storage</li>
        <li>Priority Support</li>
      </ul>
      <a href="#">Choose Plan</a>
    </div>

    <div class="plan">
      <h2>Premium</h2>
      <p class="price">$29/mo</p>
      <ul>
        <li>Unlimited Users</li>
        <li>200GB Storage</li>
        <li>24/7 Support</li>
      </ul>
      <a href="#">Choose Plan</a>
    </div>
  </section>
</body>
</html>
