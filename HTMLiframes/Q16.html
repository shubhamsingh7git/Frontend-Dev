<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URI Encoding Demo</title>
</head>
<body>

<h2>URI Encoding Example</h2>

<p>Original URL with special characters:</p>
<p>https://example.com/search?query=HTML & CSS</p>

<p>Correct encoded version:</p>
<a href="https://example.com/search?query=HTML%20%26%20CSS">
  https://example.com/search?query=HTML%20%26%20CSS
</a>

</body>
</html>
