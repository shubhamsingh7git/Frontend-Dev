<!DOCTYPE html>
<html>
<head>
<title>Frameset Layout</title>
</head>

<frameset rows="20%,80%">

  <frame src="data:text/html,
    <html>
    <body>
    <h3>Navigation</h3>
    <a href='#'>Home</a> |
    <a href='#'>About</a> |
    <a href='#'>Contact</a>
    </body>
    </html>
  ">

  <frame src="data:text/html,
    <html>
    <body>
    <h2>Welcome to My Website</h2>
    </body>
    </html>
  ">

</frameset>

</html>
