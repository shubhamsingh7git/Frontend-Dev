<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Security Demo</title>
</head>
<body>

<h2>Secure Form</h2>

<form autocomplete="off">
  <label>Username:</label><br>
  <input type="text" required><br><br>

  <label>Password:</label><br>
  <input type="password" required><br><br>

  <button type="submit">Login</button>
</form>

<p>Note: Disabling autocomplete helps prevent browsers from storing sensitive information, reducing the risk of unauthorized access.</p>

</body>
</html>
