<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Form</title>
</head>
<body>

<h2>Feedback Form</h2>

<form method="post" action="#">
  <label>Your Feedback:</label><br>
  <textarea name="feedback" rows="5" cols="40" required></textarea><br><br>

  <label>Rate Us:</label><br>
  <input type="radio" name="rating" value="good" required> Good<br>
  <input type="radio" name="rating" value="average"> Average<br>
  <input type="radio" name="rating" value="poor"> Poor<br><br>

  <button type="submit">Submit</button>
</form>

</body>
</html>
