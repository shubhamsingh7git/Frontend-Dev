<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dropdown Selection Page</title>
    <!-- Only HTML used. No CSS or JavaScript. -->
  </head>
  <body>
    <!-- ============ HEADER ============ -->
    <header>
      <h1>Dropdown-based Selection</h1>
    </header>

    <!-- ============ MAIN CONTENT ============ -->
    <main>
      <form>
        <!-- Country Dropdown -->
        <p>
          <label for="country">Country:</label><br />
          <select id="country" name="country">
            <option value="india" selected>India</option>
            <option value="usa">USA</option>
            <option value="japan">Japan</option>
          </select>
        </p>

        <!-- State Dropdown -->
        <p>
          <label for="state">State:</label><br />
          <select id="state" name="state">
            <option value="maharashtra" selected>Maharashtra</option>
            <option value="karnataka">Karnataka</option>
            <option value="gujarat">Gujarat</option>
          </select>
        </p>

        <!-- City Dropdown -->
        <p>
          <label for="city">City:</label><br />
          <select id="city" name="city">
            <option value="mumbai" selected>Mumbai</option>
            <option value="pune">Pune</option>
            <option value="nagpur">Nagpur</option>
          </select>
        </p>

        <!-- Favorite Tourist Place Dropdown -->
        <p>
          <label for="tourist">Favorite Tourist Place:</label><br />
          <select id="tourist" name="tourist">
            <option value="gateway" selected>Gateway of India</option>
            <option value="tajmahal">Taj Mahal</option>
            <option value="kashmir">Kashmir</option>
          </select>
        </p>
      </form>

      <!-- Summary Paragraph -->
      <p>
        Your selected location is Mumbai, Maharashtra, India, and your favorite
        tourist place is the Gateway of India.
      </p>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer>
      <p>&copy; 2025 Travel Selection Portal. All rights reserved.</p>
    </footer>
  </body>
</html>
