<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .product-card { transition: all .3s ease }
    .product-card:hover { transform: scale(1.03); box-shadow: 0 4px 20px rgba(0,0,0,.1) }
    .product-img { height: 200px; object-fit: cover }
    .product-svg { width: 100%; height: 200px; display: block }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center fw-bold mb-5">Our Products</h2>
    <div class="row g-4">

      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://images.pexels.com/photos/437037/pexels-photo-437037.jpeg?auto=compress&cs=tinysrgb&w=600" class="card-img-top product-img" alt="Smartwatch">
          <div class="card-body text-center">
            <h5 class="card-title">Smartwatch</h5>
            <p class="text-muted mb-3">$99.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://images.pexels.com/photos/3394665/pexels-photo-3394665.jpeg?auto=compress&cs=tinysrgb&w=600" class="card-img-top product-img" alt="Wireless Headphones">
          <div class="card-body text-center">
            <h5 class="card-title">Wireless Headphones</h5>
            <p class="text-muted mb-3">$79.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm h-100">
          <svg class="product-svg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bluetooth Speaker">
            <rect x="40" y="60" width="320" height="180" rx="24" fill="#e9ecef"/>
            <circle cx="130" cy="150" r="55" fill="#adb5bd"/>
            <circle cx="130" cy="150" r="35" fill="#6c757d"/>
            <circle cx="270" cy="150" r="55" fill="#adb5bd"/>
            <circle cx="270" cy="150" r="35" fill="#6c757d"/>
            <rect x="180" y="85" width="40" height="10" rx="5" fill="#495057"/>
            <rect x="60" y="240" width="280" height="8" rx="4" fill="#ced4da"/>
            <text x="200" y="30" text-anchor="middle" font-size="16" fill="#6c757d">Bluetooth Speaker</text>
          </svg>
          <div class="card-body text-center">
            <h5 class="card-title">Bluetooth Speaker</h5>
            <p class="text-muted mb-3">$49.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <div class="card product-card shadow-sm h-100">
          <svg class="product-svg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fitness Tracker">
            <rect x="150" y="40" width="100" height="220" rx="28" fill="#212529"/>
            <rect x="165" y="70" width="70" height="160" rx="14" fill="#343a40"/>
            <rect x="178" y="95" width="44" height="60" rx="8" fill="#0d6efd"/>
            <circle cx="200" cy="195" r="8" fill="#6c757d"/>
            <text x="200" y="30" text-anchor="middle" font-size="16" fill="#6c757d">Fitness Tracker</text>
          </svg>
          <div class="card-body text-center">
            <h5 class="card-title">Fitness Tracker</h5>
            <p class="text-muted mb-3">$59.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
